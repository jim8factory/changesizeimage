<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>画像リサイズ＆縦横比変更</title>
<style>
  body { font-family: sans-serif; margin: 10px; }
  canvas { border: 1px solid #ccc; max-width: 100%; }
  .row { margin-bottom: 8px; }
  label { margin-right: 8px; }
</style>
</head>
<body>
<h3>画像の縦横比率変更とサイズ縮小</h3>

<div class="row">
  <input type="file" id="fileInput" accept="image/*">
</div>

<div class="row">
  <label>幅(px): <input type="number" id="widthInput" value="400"></label>
  <label>高さ(px): <input type="number" id="heightInput" value="300"></label>
  <label><input type="checkbox" id="lockAspect" checked> 縦横比を固定</label>
</div>

<div class="row">
  <button id="applyBtn">適用してプレビュー</button>
  <button id="downloadBtn">画像を保存</button>
</div>

<canvas id="canvas"></canvas>

<script>
const fileInput   = document.getElementById('fileInput');
const widthInput  = document.getElementById('widthInput');
const heightInput = document.getElementById('heightInput');
const lockAspect  = document.getElementById('lockAspect');
const applyBtn    = document.getElementById('applyBtn');
const downloadBtn = document.getElementById('downloadBtn');
const canvas      = document.getElementById('canvas');
const ctx         = canvas.getContext('2d');

let originalImg = null;
let originalAspect = 1;

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      originalImg = img;
      originalAspect = img.width / img.height;
      widthInput.value  = img.width;
      heightInput.value = img.height;
      drawResized();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

widthInput.addEventListener('input', () => {
  if (lockAspect.checked && originalImg) {
    const w = parseInt(widthInput.value || 0, 10);
    const h = Math.round(w / originalAspect);
    heightInput.value = h;
  }
});

heightInput.addEventListener('input', () => {
  if (lockAspect.checked && originalImg) {
    const h = parseInt(heightInput.value || 0, 10);
    const w = Math.round(h * originalAspect);
    widthInput.value = w;
  }
});

applyBtn.addEventListener('click', drawResized);

function drawResized() {
  if (!originalImg) return;
  const w = parseInt(widthInput.value || 0, 10);
  const h = parseInt(heightInput.value || 0, 10);
  if (w <= 0 || h <= 0) return;

  canvas.width  = w;
  canvas.height = h;
  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(originalImg, 0, 0, w, h);
}

downloadBtn.addEventListener('click', () => {
  if (!canvas.width || !canvas.height) return;
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'resized.png';
  a.click();
});
</script>
</body>
</html>
